# SmartHarvest — Reusable Docker Build + Trivy Scan
# Used by: PR (soft scan) and develop (strict scan before publish)
name: _Docker Build — Build + Trivy Scan

on:
  workflow_call:
    inputs:
      service-name:
        description: "Service name (must match Helm key under .services.*)"
        required: true
        type: string
      service-path:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "."
      fail-on-critical:
        description: "Trivy exit-code: 1 = fail on CRITICAL (develop), 0 = soft scan (PR)"
        required: false
        type: string
        default: "0"
    outputs:
      trivy-critical:
        description: "Whether CRITICAL vulnerabilities were found (true/false)"
        value: ${{ jobs.build-scan.outputs.trivy_critical }}

jobs:
  build-scan:
    name: "Build & Scan — ${{ inputs.service-name }}"
    runs-on: ubuntu-latest
    outputs:
      trivy_critical: ${{ steps.trivy_check.outputs.critical_found }}
    defaults:
      run:
        working-directory: ${{ inputs.service-path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Build Temp Image (local only, never pushed) ───
      - name: Build Docker Image
        run: |
          docker build -t ${{ inputs.service-name }}:${{ github.sha }} .
          echo "✅ Image built: ${{ inputs.service-name }}:${{ github.sha }}"

      # ─── Trivy Scan ───
      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ inputs.service-name }}:${{ github.sha }}"
          format: "table"
          output: "${{ github.workspace }}/trivy-report-${{ inputs.service-name }}.txt"
          scan-type: "image"
          severity: "CRITICAL,HIGH"
          exit-code: ${{ inputs.fail-on-critical }}
          ignore-unfixed: true
          vuln-type: "os,library"

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ inputs.service-name }}
          path: "${{ github.workspace }}/trivy-report-${{ inputs.service-name }}.txt"
          retention-days: 14

      # ─── Critical Check (output for downstream decisions) ───
      - name: Check Trivy for Criticals
        id: trivy_check
        if: always()
        run: |
          REPORT="${{ github.workspace }}/trivy-report-${{ inputs.service-name }}.txt"
          if [ -f "$REPORT" ] && grep -qE "CRITICAL" "$REPORT"; then
            echo "critical_found=true" >> $GITHUB_OUTPUT
            echo "⚠️ CRITICAL vulnerabilities found!"
          else
            echo "critical_found=false" >> $GITHUB_OUTPUT
            echo "✅ No critical vulnerabilities."
          fi
