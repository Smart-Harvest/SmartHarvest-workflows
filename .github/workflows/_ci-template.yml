# SmartHarvest — Reusable CI Template
# ────────────────────────────────────────────────────────────
# PR:      code-quality → docker-build (soft scan) → STOP
# develop: code-quality → docker-build (strict) → publish → cd (values-dev.yaml)
# main:    publish (retag only, NO rebuild) → cd (values-prod.yaml)
# ────────────────────────────────────────────────────────────
name: CI Template

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: "Service key under .services.* in Helm values"
      service-path:
        required: true
        type: string
      runtime:
        required: false
        type: string
        default: "node"
      node-version:
        required: false
        type: string
        default: "20"
      python-version:
        required: false
        type: string
        default: "3.11"
    secrets:
      SNYK_TOKEN:
        required: true
      SONAR_TOKEN:
        required: true
      SONAR_URL:
        required: true
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      HELM_REPO_PAT:
        required: true

# ═════════════════════════════════════════════════════════════
# JOBS
# ═════════════════════════════════════════════════════════════
jobs:

  # ─────────────────────────────────────────────────────────
  # 1. CODE QUALITY (PR + develop only)
  # ─────────────────────────────────────────────────────────
  code-quality:
    name: "Code Quality — ${{ inputs.service-name }}"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    concurrency:
      group: code-quality-${{ inputs.service-name }}-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.service-path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # SAST — SonarQube
      - name: Run Sonar Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: ${{ inputs.service-path }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}

      - name: Sonar Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          scanMetadataReportFile: ${{ inputs.service-path }}/.scannerwork/report-task.txt
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Runtime Setup
      - name: Setup Node.js
        if: inputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: "${{ inputs.service-path }}/package-lock.json"

      - name: Setup Python
        if: inputs.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install Node dependencies
        if: inputs.runtime == 'node'
        run: npm ci

      - name: Check unused dependencies (node)
        if: inputs.runtime == 'node'
        run: npx depcheck || true

      - name: Install Python dependencies
        if: inputs.runtime == 'python'
        run: pip install -r requirements.txt

      # SCA — Snyk
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Install snyk-to-html
        run: npm install -g snyk-to-html

      - name: Snyk — Scan dependencies (Node)
        if: inputs.runtime == 'node'
        run: snyk test --severity-threshold=high --json-file-output=snyk-report.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk — Scan dependencies (Python)
        if: inputs.runtime == 'python'
        run: snyk test --file=requirements.txt --package-manager=pip --severity-threshold=high --json-file-output=snyk-report.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Convert Snyk report to HTML
        run: snyk-to-html -i snyk-report.json -o snyk-report.html

      - name: Upload Snyk HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-report-${{ inputs.service-name }}
          path: ${{ inputs.service-path }}/snyk-report.html
          retention-days: 14

      - name: Check for Critical Vulnerabilities
        id: snyk-check
        run: |
          CRITICAL_COUNT=$(jq '[.vulnerabilities[] | select(.severity == "critical" or .severity == "high")] | length' snyk-report.json 2>/dev/null || echo "0")
          echo "Critical count: $CRITICAL_COUNT"
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "critical_found=true" >> $GITHUB_OUTPUT
          else
            echo "critical_found=false" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────
  # 2. DOCKER BUILD + TRIVY SCAN (PR = soft, develop = strict)
  # ─────────────────────────────────────────────────────────
  docker-build-pr:
    name: "Docker Build — PR Scan"
    needs: [code-quality]
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_docker-build.yml
    with:
      service-name: ${{ inputs.service-name }}
      service-path: ${{ inputs.service-path }}
      fail-on-critical: "0"

  docker-build-develop:
    name: "Docker Build — Develop Scan"
    needs: [code-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/_docker-build.yml
    with:
      service-name: ${{ inputs.service-name }}
      service-path: ${{ inputs.service-path }}
      fail-on-critical: "1"

  # ─────────────────────────────────────────────────────────
  # 3. DOCKER PUBLISH (develop = build+push, main = retag only)
  # ─────────────────────────────────────────────────────────
  publish-develop:
    name: "Publish — develop"
    needs: [docker-build-develop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/_docker-publish.yml
    with:
      service-name: ${{ inputs.service-name }}
      service-path: ${{ inputs.service-path }}
      environment: develop
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  publish-main:
    name: "Publish — main (retag only)"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_docker-publish.yml
    with:
      service-name: ${{ inputs.service-name }}
      service-path: ${{ inputs.service-path }}
      environment: main
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  # ─────────────────────────────────────────────────────────
  # 4. CD — Update Helm Values (triggers ArgoCD auto-sync)
  # ─────────────────────────────────────────────────────────
  cd-develop:
    name: "CD — dev"
    needs: [publish-develop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/_cd-template.yml
    with:
      service-name: ${{ inputs.service-name }}
      image-tag: dev-${{ github.sha }}
      environment: develop
    secrets:
      HELM_REPO_PAT: ${{ secrets.HELM_REPO_PAT }}

  cd-main:
    name: "CD — prod"
    needs: [publish-main]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_cd-template.yml
    with:
      service-name: ${{ inputs.service-name }}
      image-tag: ${{ needs.publish-main.outputs.image-tag }}
      environment: main
    secrets:
      HELM_REPO_PAT: ${{ secrets.HELM_REPO_PAT }}
